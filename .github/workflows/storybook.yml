name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/fabi-ui/package-lock.json
      - run: npm ci --legacy-peer-deps
      # @fabi/ui: Storybook reads its subpath stubs (@fabi/ui/icons, /charts, /locale/…) from dist/
      - run: npm ci
        working-directory: packages/fabi-ui
      - run: npm run build
        working-directory: packages/fabi-ui
      # Every story renders and passes axe (strict) in Light and Dark
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --project storybook
        env:
          VITE_A11Y_STRICT: '1'
          VITE_MODE: light
      - run: npx vitest run --project storybook
        env:
          VITE_A11Y_STRICT: '1'
          VITE_MODE: dark
      - run: npm run build-storybook
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
