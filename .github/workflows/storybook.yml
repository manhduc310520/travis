name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `@untitledui-pro/icons` is a paid private package (see .npmrc, which
      # reads the token from this env var rather than storing it) — without
      # this secret, npm ci fails to authenticate against pkg.untitledui.com.
      - run: npm ci
        env:
          UNTITLEDUI_PRO_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}
      # Rebuilds the fc tokens from the Figma export; fails on dangling --fc-*
      # references or media queries off the breakpoint tokens.
      - run: npm run build:tokens
      # Every text / border token pair must meet WCAG in every brand and mode.
      - run: npm run audit:contrast
      - run: npm run build-storybook
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
